[project]
name = "backend"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi[standard] (>=0.156.8,<0.157.0)",
    "openai (>=3.35.1,<4.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.1.5,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "taskiq (>=0.13.0,<0.14.0)",
    "taskiq-fastapi (>=0.5.0,<0.6.0)",
    "taskiq-nats (>=0.7.0,<0.8.0)",
    "taskiq-redis (>=1.2.4,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-asyncio = "^1.4"
httpx = "^0.28"
ruff = "^0.17"
mypy = "^1.19"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.isort]
profile = "black"
known_first_party = ["backend"]
known_third_party = ["alembic"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["taskiq_nats.*", "nats.*", "taskiq_redis.*"]
ignore_missing_imports = true
